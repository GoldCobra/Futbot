services:
  futbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: futbot
    env_file:
      - ./.env
    environment:
      FUTBOT_RUNTIME_DIR: /app/runtime
    volumes:
      - ./runtime:/app/runtime
    restart: unless-stopped
    init: true
    # mssql: the SQL Server container on the VPS (/opt/mssql), reachable as host "mssql".
    networks:
      - default
      - mssql

networks:
  mssql:
    external: true
