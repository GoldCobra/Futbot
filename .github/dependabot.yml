version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # graphql 17 and graphql-request 7 (ESM-only) would mean rebuilding the start.gg integration for no gain.
      - dependency-name: graphql
        update-types: ["version-update:semver-major"]
      - dependency-name: graphql-request
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
